set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"

set -g escape-time 0
set -g history-limit 8192
set -g display-time 1000
set -g pane-border-status top
set -g pane-border-format ' #{pane_index} | #("$HOME/.tmux/pane-command" #{pane_pid} #{pane_width}) '
set -g pane-border-style "fg=colour238,bg=default"
set -g pane-active-border-style "fg=colour51,bg=default"

set -g default-terminal "tmux-256color"
set -g extended-keys on
set -g extended-keys-format csi-u
set -g allow-passthrough on

unbind-key -n Home
unbind-key -n End

set -g status-style 'fg=colour51,bg=default'
set -g status-interval 1
set -g status-right-length 120
set -g status-right '#("$HOME/.tmux/status-system")  󰃭 %m-%d  󰥔 %H:%M '

run "~/.tmux/plugins/tpm/tpm"
